<svg xmlns="http://www.w3.org/2000/svg" width="820" height="310" viewBox="0 0 820 310" role="img" aria-labelledby="connection-map-title connection-map-desc"><style>text{font-family:system-ui,sans-serif;fill:#23362b}.map-wire{fill:none;stroke:#9fae94;stroke-width:3}.map-node rect{fill:#f4f7ed;stroke:#839978;stroke-width:1.5}.map-title{font-size:17px;font-weight:700}.map-caption{font-size:12px}.pi-body{fill:#244633}.pi-text{fill:#fff}.pi-caption{fill:#d9e3cd}.map-dot{fill:#58724c}</style>
            <title id="connection-map-title">AOG physical connection map</title><desc id="connection-map-desc">The Raspberry Pi connects by USB to Sensor Kit and Dual OVF Arduinos. Sensor Kit reads air sensors; Dual OVF reads overflow switches and pH. Either board can detect water probes on D6 and D8. The board selector below the page title opens its wiring and raw readings.</desc>
            <path id="map-link-kit" class="map-wire" d="M179 155H220V72H276"/><path id="map-link-ovf" class="map-wire" d="M179 155H220V225H276"/>
            <path class="map-wire" d="M470 72H526V36H578M526 72V111H578M470 225H526V188H578M526 225V265H578"/>
            <g><rect class="pi-body" x="14" y="104" width="165" height="105" rx="20"/><circle cx="37" cy="128" r="4" fill="#c7da87"/><text class="map-title pi-text" x="34" y="160">AOG controller</text><text class="map-caption pi-caption" x="34" y="181">Raspberry Pi · USB</text></g>
            <g id="map-kit" class="map-node"><rect x="276" y="24" width="194" height="100" rx="17"/><circle class="map-dot" cx="298" cy="46" r="4"/><text class="map-title" x="296" y="74">Sensor Kit</text><text class="map-caption" id="map-status-kit" x="296" y="99">USB serial connection</text></g>
            <g id="map-ovf" class="map-node"><rect x="276" y="176" width="194" height="100" rx="17"/><circle class="map-dot" cx="298" cy="198" r="4"/><text class="map-title" x="296" y="226">Dual OVF</text><text class="map-caption" id="map-status-ovf" x="296" y="251">USB serial connection</text></g>
            <g class="map-node"><rect x="578" y="9" width="225" height="58" rx="13"/><text x="595" y="34" font-weight="700" font-size="14">Air &amp; gas sensors</text><text class="map-caption" x="595" y="53">D7 · A0 · A4 / A5</text></g>
            <g class="map-node"><rect x="578" y="84" width="225" height="58" rx="13"/><text x="595" y="109" font-weight="700" font-size="14">Water probes · D6 / D8</text><text class="map-caption" x="595" y="128">Optional · detect on either board</text></g>
            <g class="map-node"><rect x="578" y="160" width="225" height="58" rx="13"/><text x="595" y="185" font-weight="700" font-size="14">Overflow switches</text><text class="map-caption" x="595" y="204">D2 / D4 → GND</text></g>
            <g class="map-node"><rect x="578" y="235" width="225" height="58" rx="13"/><text x="595" y="260" font-weight="700" font-size="14">pH + optional water probes</text><text class="map-caption" x="595" y="279">pH → A0 · water → D6 / D8</text></g>
          </svg>
