<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#183d30"><title>AOG · Sign in</title><link rel="icon" href="/img/logo.png"><link rel="stylesheet" href="/css/aog.css"><script defer src="/js/aog/login.js"></script></head>
<body class="login-body"><main class="login-card"><div class="brand"><span class="brand-mark" aria-hidden="true">↗</span><span>AOG<small>GROW CONTROL</small></span></div><h1>Welcome to your grow.</h1><p>Sign in to see your environment and manage your setup.</p><div id="login-notice" class="notice" role="status" hidden></div><form id="login-form" action="/authenticate" method="post"><label>Username<input id="input_username" name="input_username" value="admin" autocomplete="username" required></label><label>Password<input id="input_password" name="input_password" type="password" autocomplete="current-password" required autofocus></label><label class="check-label"><input id="show-password" type="checkbox"> Show password</label><button type="submit" class="button primary">Sign in →</button><p id="login-error" class="form-result error" role="alert"></p></form><div class="login-footer">Your grow. Your device. Your control.</div></main></body>
</html>
