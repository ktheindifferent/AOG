[package]
name = "multipart"
version = "0.18.0"
edition = "2021"
publish = false
description = "Compatibility adapter for Rouille's multipart dependency"

[dependencies]
multipart_ng = { version = "=0.18.0", default-features = false }

[features]
default = ["multipart_ng/default"]
client = ["multipart_ng/client"]
server = ["multipart_ng/server"]
mock = ["multipart_ng/mock"]
