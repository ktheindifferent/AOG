name: Verify AOG v2
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controller:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libudev-dev libv4l-dev pkg-config
          sudo mkdir -p /opt/aog
          sudo chown "$(id -u):$(id -g)" /opt/aog
      - name: Rust toolchain
        run: rustup update stable --no-self-update
      - name: Backend regressions
        run: cargo +stable test --locked -j2 -- --test-threads=1
      - name: RAM buffer invariants
        run: |
          c++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined firmware/tests/ram_buffer_test.cpp -o /tmp/aog-ram-buffer-test
          /tmp/aog-ram-buffer-test
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1
      - name: Build every supported Arduino profile
        run: |
          arduino-cli config init --dest-file /tmp/aog-arduino-cli.yaml
          python3 firmware/build.py --cli arduino-cli --config /tmp/aog-arduino-cli.yaml --install
      - uses: actions/upload-artifact@v4
        with:
          name: aog-firmware-2.0.0
          path: firmware/package/
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Browser tools
        run: |
          python3 -m venv /tmp/aog-browser
          /tmp/aog-browser/bin/pip install playwright
          /tmp/aog-browser/bin/playwright install --with-deps chromium
      - name: Dashboard regressions
        run: |
          export CHROMIUM=$(/tmp/aog-browser/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          /tmp/aog-browser/bin/python tests/web_ui_test.py
          /tmp/aog-browser/bin/python tests/web_ui_hardware_test.py
